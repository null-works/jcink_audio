services:
  audio-cache:
    build: .
    container_name: audio-cache
    restart: unless-stopped
    ports:
      - "8942:8000"
    volumes:
      # Host data dir holds cache.db AND cookies.txt (mounted to /app/data)
      - /opt/jcink_audio/data:/app/data
    # Secrets (R2_*, SPOTIFY_*, DASHBOARD_*) live in .env on the server only.
    # .env is gitignored — never commit real credentials. See .env.example.
    env_file:
      - .env
    environment:
      - R2_BUCKET=imagehut-media
      - R2_PUBLIC_URL=https://media.imagehut.ch
      - MAX_TRACKS=15
      - AUDIO_BITRATE=128k
      # yt-dlp needs cookies to download from this datacenter IP (YouTube
      # bot-check). Drop a Netscape cookies.txt at /opt/jcink_audio/data/.
      - YOUTUBE_COOKIES_FILE=/app/data/cookies.txt
      # PO-token provider sidecar (below). Without it YouTube returns only
      # storyboard images even with valid cookies.
      - YOUTUBE_POT_BASE_URL=http://bgutil-provider:4416
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    init: true
